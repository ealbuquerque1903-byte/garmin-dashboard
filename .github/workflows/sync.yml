name: Garmin Report

on:
  workflow_dispatch:
    inputs:
      report_type:
        description: 'Tipo de relatório'
        type: choice
        default: 'atividades'
        options: [atividades, dia, consolidado, ambos]
      data:
        description: 'Data (YYYY-MM-DD) — obrigatória apenas para report_type=dia'
        type: string
        required: false
        default: ''

concurrency:
  group: garmin-sync
  cancel-in-progress: false

env:
  TZ: America/Sao_Paulo

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Validar input data (modo dia)
        if: ${{ inputs.report_type == 'dia' }}
        run: |
          if [ -z "${{ inputs.data }}" ]; then
            echo "ERRO: report_type=dia requer o campo 'data' preenchido (YYYY-MM-DD)."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Restaurar tokens Garmin
        env:
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
        run: |
          mkdir -p .garmin_tokens_v3
          printf '%s' "$GARMIN_TOKENS" > .garmin_tokens_v3/garmin_tokens.json

      - name: Sincronizar dados
        env:
          GARMIN_TOKEN_DIR: .garmin_tokens_v3
        run: python3 sync.py 30

      - name: Persistir tokens renovados
        # Roda sempre (if: always()) para salvar tokens rotacionados mesmo se step posterior falhar.
        # Compara hashes SHA-256 para evitar update desnecessário e não vazar conteúdo nos logs.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_SECRETS }}
          GARMIN_TOKENS_ORIGINAL: ${{ secrets.GARMIN_TOKENS }}
        run: |
          [ -f .garmin_tokens_v3/garmin_tokens.json ] || { echo "Tokens não gerados neste run — nada a persistir."; exit 0; }
          HASH_ORIG=$(printf '%s' "$GARMIN_TOKENS_ORIGINAL" | sha256sum | cut -d' ' -f1)
          HASH_NEW=$(sha256sum .garmin_tokens_v3/garmin_tokens.json | cut -d' ' -f1)
          if [ "$HASH_ORIG" != "$HASH_NEW" ]; then
            gh secret set GARMIN_TOKENS --repo "$GITHUB_REPOSITORY" < .garmin_tokens_v3/garmin_tokens.json
            echo "✓ Tokens renovados e persistidos no Secret."
          else
            echo "Tokens inalterados — nenhuma ação necessária."
          fi

      - name: Verificar dados sincronizados
        run: |
          python3 - <<'EOF'
          import json, sys
          h = json.load(open("garmin/history.json"))
          acts  = len(h.get("activities", {}))
          well  = len(h.get("wellness", {}))
          zones = bool(h.get("hr_zone_limits", {}).get("zones"))
          devs  = len(h.get("devices", []))
          today = sorted(h.get("wellness", {}).items(), reverse=True)
          today_data = next(((d,w) for d,w in today if w.get("sleep_score") or w.get("hrv_avg") or w.get("rhr")), None)
          print(f"✓ {acts} atividades | {well} dias bem-estar | zonas FC: {zones} | {devs} dispositivos")
          if today_data:
              d, w = today_data
              print(f"✓ Último bem-estar ({d}): sono={w.get('sleep_score')} HRV={w.get('hrv_avg')} FC={w.get('rhr')} battery={w.get('body_battery_charged')}")
          if well == 0:
              print("ERRO: nenhum dia de bem-estar sincronizado")
              sys.exit(1)
          EOF

      - name: Salvar history.json no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add garmin/history.json
          git diff --cached --quiet && echo "Sem alterações." || \
            (git commit -m "data: sync automático $(date -u '+%Y-%m-%d %H:%M UTC')" && \
             git pull --rebase origin main && \
             git push)

      - name: Gerar relatórios PDF
        run: |
          if [ "${{ inputs.report_type }}" = "dia" ]; then
            python3 report.py dia "${{ inputs.data }}"
          else
            python3 report.py ${{ inputs.report_type }}
          fi

      - name: Enviar e-mail com relatórios
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python3 send_email.py

      - name: Alerta de falha de autenticação
        # Disparado apenas se sync.py gravou auth_failed.flag (erro de autenticação, não outro erro)
        if: failure() && hashFiles('auth_failed.flag') != ''
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          AUTH_FAIL_MSG_FILE: auth_failed.flag
        run: |
          python3 - <<'EOF'
          import os, smtplib, socket
          from email.mime.multipart import MIMEMultipart
          from email.mime.text import MIMEText
          from datetime import date
          from pathlib import Path

          flag = Path(os.environ.get("AUTH_FAIL_MSG_FILE", "auth_failed.flag"))
          motivo = flag.read_text(encoding="utf-8").strip() if flag.exists() else "Motivo desconhecido."

          host  = os.environ["SMTP_HOST"]
          port  = int(os.environ["SMTP_PORT"])
          user  = os.environ["SMTP_USER"]
          pwd   = os.environ["SMTP_PASS"]
          frm   = os.environ["MAIL_FROM"]
          to    = os.environ["MAIL_TO"]

          msg = MIMEMultipart()
          msg["From"]    = frm
          msg["To"]      = to
          msg["Subject"] = f"Garmin: FALHA DE AUTENTICAÇÃO — ação necessária ({date.today()})"
          corpo = (
              "O workflow Garmin Report falhou por erro de autenticação.\n\n"
              f"Motivo: {motivo}\n\n"
              "O que fazer:\n"
              "1. No Mac: python3 login.py\n"
              "2. Copie o JSON exibido ao final\n"
              "3. GitHub → Settings → Secrets → GARMIN_TOKENS → atualizar\n"
              "4. Dispare o workflow novamente\n"
          )
          msg.attach(MIMEText(corpo, "plain", "utf-8"))

          if port == 465:
              srv = smtplib.SMTP_SSL(host, port, timeout=30)
          else:
              srv = smtplib.SMTP(host, port, timeout=30)
              srv.ehlo(); srv.starttls(); srv.ehlo()
          srv.login(user, pwd)
          srv.sendmail(frm, [to], msg.as_string())
          srv.quit()
          print("✓ E-mail de alerta de autenticação enviado.")
          EOF
